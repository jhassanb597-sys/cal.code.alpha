<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Alpha Calculator | jahangir</title>
   <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="logo"></div>
        <h1>calculator</h1>
        
        <div class="display-container">
            <input type="text" id="display" disabled placeholder="0">
        </div>

        <div class="buttons">
            <button onclick="clearDisplay()" class="all-clear">AC</button>
            <button onclick="appendValue('/')" class="op-button">÷</button>
            <button onclick="appendValue('*')" class="op-button">×</button>
            <button onclick="appendValue('-')" class="op-button">−</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('+')" class="op-button">+</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="partialClear()" class="pink-clear-btn">C</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="calculate()" class="equals-button">=</button>
            
            <button onclick="appendValue('0')" class="zero-button">0</button>
            <button onclick="appendValue('.')">.</button>
        </div>
    </div>
    <script src="alpha.js"></script>
</body>
</html>
